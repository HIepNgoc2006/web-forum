openapi: 3.0.3
info:
  title: 36chan API
  version: "1.0.0"
  description: Public, account, admin, feed, upload, and realtime-adjacent HTTP APIs for 36chan web/mobile/desktop clients.
servers:
  - url: http://localhost:3000/api
    description: Local dev API
tags:
  - name: Public
    description: Public browsing, posting, discovery, feeds, and uploads.
  - name: Account
    description: Optional account session, settings, private data, and My Posts APIs.
  - name: Admin
    description: Moderation, reports, sanctions, boards, and operational admin APIs.
  - name: AI
    description: Grounded chat, rewrite, summaries, and suggestion helpers with privacy guards.
paths:
  /config:
    get:
      tags: [Public]
      summary: Get public client configuration
      responses:
        "200":
          $ref: "#/components/responses/AnyData"
  /stickers:
    get:
      tags: [Public]
      summary: List owner-managed custom Imgur stickers
      description: Returns active and inactive stickers. Inactive records remain public so historical sticker tokens continue rendering, but clients exclude them from the picker.
      responses:
        "200":
          description: Custom sticker catalog
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CustomSticker"
  /media/gifs/trending:
    get:
      tags: [Public]
      summary: List trending GIFs from KLIPY
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: perPage
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        '200':
          $ref: '#/components/responses/AnyData'
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /media/gifs/search:
    get:
      tags: [Public]
      summary: Search KLIPY GIFs
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: perPage
          in: query
          schema:
            type: integer
            minimum: 8
            maximum: 50
      responses:
        '200':
          $ref: '#/components/responses/AnyData'
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /media/gifs/items:
    get:
      tags: [Public]
      summary: Resolve KLIPY GIFs by slug
      parameters:
        - name: slugs
          in: query
          required: true
          description: Comma-separated list of 1 to 50 KLIPY GIF slugs.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/AnyData'
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /media/gifs/{slug}/share:
    post:
      tags: [Public]
      summary: Register a KLIPY GIF share
      description: Sends only the GIF slug and optional search query to KLIPY.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 200
            pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  maxLength: 200
      responses:
        '200':
          $ref: '#/components/responses/AnyData'
        '400':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /home:
    get:
      tags: [Public]
      summary: Get the initial homepage snapshot in one public state read
      description: Returns config, public boards, board post counts, popular threads, latest posts, hot boards, campus pulse, and stats.
      responses:
        "200":
          $ref: "#/components/responses/AnyData"
  /health:
    get:
      tags: [Public]
      summary: Get health and readiness without secrets
      responses:
        "200":
          $ref: "#/components/responses/AnyData"
  /stats:
    get:
      tags: [Public]
      summary: Get public homepage statistics
      responses:
        "200":
          $ref: "#/components/responses/AnyData"
  /boards:
    get:
      tags: [Public]
      summary: List active public boards
      responses:
        "200":
          description: Public board list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Board"
  /boards/hot:
    get:
      tags: [Public]
      summary: List boards with recent activity
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/AnyData"
  /pulse:
    get:
      tags: [Public]
      summary: List privacy-preserving campus pulse keywords
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/AnyData"
  /posts/latest:
    get:
      tags: [Public]
      summary: List latest public posts
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/PostList"
  /boards/{boardSlug}/threads:
    get:
      tags: [Public]
      summary: List threads in a board
      parameters:
        - $ref: "#/components/parameters/BoardSlug"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/PostList"
        "404":
          $ref: "#/components/responses/Error"
    post:
      tags: [Public]
      summary: Create a thread
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/BoardSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateThreadRequest"
      responses:
        "201":
          $ref: "#/components/responses/AnyData"
        "400":
          $ref: "#/components/responses/Error"
  /boards/{boardSlug}/archive:
    get:
      tags: [Public]
      summary: List archived threads in a board
      parameters:
        - $ref: "#/components/parameters/BoardSlug"
      responses:
        "200":
          $ref: "#/components/responses/PostList"
  /boards/{boardSlug}/summary:
    post:
      tags: [AI]
      summary: Summarize public board content
      parameters:
        - $ref: "#/components/parameters/BoardSlug"
      requestBody:
        $ref: "#/components/requestBodies/PosterTokenBody"
      responses:
        "200":
          $ref: "#/components/responses/AnyData"
  /threads/{threadId}:
    get:
      tags: [Public]
      summary: Get thread details and comments
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - name: commentsPage
          in: query
          schema:
            type: integer
        - name: commentsPageSize
          in: query
          schema:
            type: integer
        - name: focusGlobalNumber
          in: query
          schema:
            type: integer
      responses:
        "200":
          $ref: "#/components/responses/AnyData"
  /threads/{threadId}/comments:
    post:
      tags: [Public]
      summary: Create a comment
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          $ref: "#/components/responses/AnyData"
  /threads/{threadId}/summary:
    post:
      tags: [AI]
      summary: Summarize a thread
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      requestBody:
        $ref: "#/components/requestBodies/PosterTokenBody"
      responses:
        "200":
          $ref: "#/components/responses/AnyData"
  /threads/{threadId}/suggestions:
    post:
      tags: [AI]
      summary: Suggest draft replies for a thread
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      requestBody:
        $ref: "#/components/requestBodies/PosterTokenBody"
      responses:
        "200":
          $ref: "#/components/responses/AnyData"
  /threads/{threadId}/poll:
    post:
      tags: [Public]
      summary: Vote once in an anonymous thread poll
      description: Voting is rejected after the thread is locked or archived.
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [optionId]
              properties:
                optionId:
                  type: string
                posterToken:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/AnyData"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /posts/{globalNumber}:
    get:
      tags: [Public]
      summary: Look up a public post by global number
      parameters:
        - $ref: "#/components/parameters/GlobalNumber"
      responses:
        "200":
          $ref: "#/components/responses/AnyData"
    post:
      tags: [Public]
      summary: Report a post
      parameters:
        - $ref: "#/components/parameters/GlobalNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                category:
                  $ref: "#/components/schemas/ReportCategory"
                reason:
                  type: string
                posterToken:
                  type: string
      responses:
        "201":
          $ref: "#/components/responses/AnyData"
    delete:
      tags: [Public]
      summary: Self-delete a post with delete password
      parameters:
        - $ref: "#/components/parameters/GlobalNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                fileOnly:
                  type: boolean
      responses:
        "200":
          $ref: "#/components/responses/AnyData"
  /ai/chat:
    post:
      tags: [AI]
      summary: Ask a grounded question about the current site, board, or thread
      description: The server builds a capped context from public allowlisted fields. Raw DOM text, private account data, moderation data, IP addresses, and tokens are never forwarded to the AI provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, scope]
              properties:
                question:
                  type: string
                  minLength: 1
                  maxLength: 1000
                scope:
                  type: string
                  enum: [site, board, thread]
                page:
                  type: string
                  enum: [home, policy, board, catalog, archive, thread, register, login, forgot, account, admin]
                boardSlug:
                  type: string
                threadId:
                  type: string
                history:
                  type: array
                  maxItems: 6
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role:
                        type: string
                        enum: [user, assistant]
                      content:
                        type: string
                        maxLength: 800
                posterToken:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/AnyData"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /ai/rewrite:
    post:
      tags: [AI]
      summary: Rewrite a draft safely without posting it
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                posterToken:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/AnyData"
  /account/register:
    post:
      tags: [Account]
      summary: Register an optional account
      requestBody:
        $ref: "#/components/requestBodies/Credentials"
      responses:
        "201":
          $ref: "#/components/responses/AuthData"
  /account/login:
    post:
      tags: [Account]
      summary: Log in to an optional account
      requestBody:
        $ref: "#/components/requestBodies/Credentials"
      responses:
        "200":
          $ref: "#/components/responses/AuthData"
  /account/logout:
    post:
      tags: [Account]
      summary: Revoke current account token
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/AnyData"
  /account/me:
    get:
      tags: [Account]
      summary: Get current account info
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/AnyData"
  /account/settings:
    put:
      tags: [Account]
      summary: Update account settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          $ref: "#/components/responses/AnyData"
  /account/private-data:
    get:
      tags: [Account]
      summary: Get private account sync data
      description: >
        Returns account-private convenience data: watchlist, drafts, savedSearches,
        contentFilters, replyTemplates, posterNotes, hiddenPosts, and hiddenThreads.
        Never exposed on public post serializers or sent to AI payloads.
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/AnyData"
    put:
      tags: [Account]
      summary: Replace private account sync data
      description: >
        Upserts one or more private-data sections. Server normalizes and caps list
        sizes (e.g. hiddenPosts max 500, hiddenThreads max 200). Logged-out clients
        keep the same shapes in localStorage and merge on login.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                watchlist:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                drafts:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                savedSearches:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                contentFilters:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                replyTemplates:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                posterNotes:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                hiddenPosts:
                  type: array
                  description: Post global numbers the viewer has hidden (UI filter only).
                  items:
                    type: string
                hiddenThreads:
                  type: array
                  description: Thread ids the viewer has hidden (UI filter only).
                  items:
                    type: string
              additionalProperties: false
      responses:
        "200":
          $ref: "#/components/responses/AnyData"
    delete:
      tags: [Account]
      summary: Clear private account sync data
      description: >
        Clears one section when `section` is set, or the entire private-data bag when omitted.
      security:
        - bearerAuth: []
      parameters:
        - name: section
          in: query
          schema:
            type: string
            enum:
              - watchlist
              - drafts
              - savedSearches
              - contentFilters
              - replyTemplates
              - posterNotes
              - hiddenPosts
              - hiddenThreads
      responses:
        "200":
          $ref: "#/components/responses/AnyData"
  /account/posts:
    get:
      tags: [Account]
      summary: List posts linked to current account without exposing identity publicly
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/PostList"
  /admin/login:
    post:
      tags: [Admin]
      summary: Admin login
      requestBody:
        $ref: "#/components/requestBodies/Credentials"
      responses:
        "200":
          $ref: "#/components/responses/AuthData"
  /admin/stickers:
    get:
      tags: [Admin]
      summary: List custom stickers for owner management
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/AnyData"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [Admin]
      summary: Add a custom sticker from a single-image Imgur link
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomStickerCreate"
      responses:
        "201":
          $ref: "#/components/responses/AnyData"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /admin/stickers/{key}:
    patch:
      tags: [Admin]
      summary: Hide or restore a custom sticker in the picker
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            pattern: '^custom-[a-z0-9-]{8,80}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active:
                  type: boolean
      responses:
        "200":
          $ref: "#/components/responses/AnyData"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /admin/boards:
    get:
      tags: [Admin]
      summary: List all boards including hidden and archived boards
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/AnyData"
    post:
      tags: [Admin]
      summary: Create a dynamic board
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardWriteRequest"
      responses:
        "201":
          $ref: "#/components/responses/AnyData"
  /admin/boards/{boardSlug}:
    put:
      tags: [Admin]
      summary: Update a dynamic board
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BoardSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardWriteRequest"
      responses:
        "200":
          $ref: "#/components/responses/AnyData"
  /admin/pending:
    get:
      tags: [Admin]
      summary: List pending posts
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BoardSlugQuery"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/PostList"
  /admin/reports:
    get:
      tags: [Admin]
      summary: List user reports
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BoardSlugQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/ReportCategoryQuery"
      responses:
        "200":
          $ref: "#/components/responses/AnyData"
  /admin/moderation-actions:
    get:
      tags: [Admin]
      summary: List moderation audit log entries
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BoardSlugQuery"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/AnyData"
  /admin/sanctions:
    get:
      tags: [Admin]
      summary: List active and historical sanctions
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/AnyData"
  /admin/pending/{id}/approve:
    post:
      tags: [Admin]
      summary: Approve a pending thread or comment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        $ref: "#/components/requestBodies/ReasonBody"
      responses:
        "200":
          $ref: "#/components/responses/AnyData"
  /admin/pending/{id}/delete:
    post:
      tags: [Admin]
      summary: Delete a pending thread or comment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        $ref: "#/components/requestBodies/ReasonBody"
      responses:
        "200":
          $ref: "#/components/responses/AnyData"
  /admin/threads/{threadId}/archive:
    post:
      tags: [Admin]
      summary: Manually archive a public thread
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      requestBody:
        $ref: "#/components/requestBodies/ReasonBody"
      responses:
        "200":
          $ref: "#/components/responses/AnyData"
  /admin/threads/{threadId}/sticky:
    post:
      tags: [Admin]
      summary: Sticky or unsticky a public thread
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sticky:
                  type: boolean
      responses:
        "200":
          $ref: "#/components/responses/AnyData"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    BoardSlug:
      name: boardSlug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    BoardSlugQuery:
      name: boardSlug
      in: query
      schema:
        type: string
    ThreadId:
      name: threadId
      in: path
      required: true
      schema:
        type: string
    GlobalNumber:
      name: globalNumber
      in: path
      required: true
      schema:
        type: integer
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
    ReportCategoryQuery:
      name: category
      in: query
      schema:
        $ref: "#/components/schemas/ReportCategory"
  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [username, password]
            properties:
              username:
                type: string
              password:
                type: string
                format: password
    PosterTokenBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              posterToken:
                type: string
    ReasonBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              reason:
                type: string
  responses:
    AnyData:
      description: Standard JSON envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    AuthData:
      description: Account/admin token response
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Envelope"
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
    PostList:
      description: Post list or paginated post list
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    Error:
      description: Standard error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Envelope:
      type: object
      properties:
        data:
          description: Endpoint-specific response data.
        error:
          nullable: true
          $ref: "#/components/schemas/ErrorObject"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorObject"
    ErrorObject:
      type: object
      required: [message]
      properties:
        message:
          type: string
        code:
          type: string
    ReportCategory:
      type: string
      enum: [Spam, Toxic, PII, Fake News, Illegal, Other]
    CustomSticker:
      type: object
      required: [key, label, url, active, createdAt]
      properties:
        key:
          type: string
          pattern: '^custom-[a-z0-9-]{8,80}$'
        label:
          type: string
          maxLength: 80
        url:
          type: string
          format: uri
          pattern: '^https://i\.imgur\.com/[A-Za-z0-9]+\.(png|jpg|gif|webp)$'
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
    CustomStickerCreate:
      type: object
      required: [url]
      properties:
        label:
          type: string
          maxLength: 80
        url:
          type: string
          format: uri
          maxLength: 500
          description: A single-image HTTPS Imgur page or direct i.imgur.com PNG/JPEG/GIF/WebP URL.
    PageMeta:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    Board:
      type: object
      required: [slug, path, name, category, description]
      properties:
        slug:
          type: string
        path:
          type: string
        name:
          type: string
        category:
          type: string
        description:
          type: string
        temporary:
          type: boolean
        eventEndsAt:
          type: string
          nullable: true
    BoardWriteRequest:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        category:
          type: string
        description:
          type: string
        isHidden:
          type: boolean
        isArchived:
          type: boolean
    PublicPost:
      type: object
      properties:
        id:
          type: string
        boardSlug:
          type: string
        globalNumber:
          type: integer
        displayName:
          type: string
        body:
          type: string
        bodyLines:
          type: array
          items:
            type: object
            additionalProperties: true
        createdAt:
          type: string
        image:
          $ref: "#/components/schemas/Image"
    Image:
      type: object
      properties:
        url:
          type: string
        mimeType:
          type: string
        filename:
          type: string
        sizeBytes:
          type: integer
        width:
          type: integer
        height:
          type: integer
    CreateThreadRequest:
      type: object
      required: [body, captchaToken]
      properties:
        body:
          type: string
        captchaToken:
          type: string
        posterToken:
          type: string
        displayName:
          type: string
        options:
          type: string
        deletePassword:
          type: string
        pollOptions:
          type: array
          minItems: 2
          maxItems: 6
          uniqueItems: true
          description: Optional poll choices. Blank, duplicate, or malformed choices are rejected when a poll is supplied.
          items:
            type: string
            minLength: 1
            maxLength: 120
        image:
          $ref: "#/components/schemas/Image"
    CreateCommentRequest:
      type: object
      required: [body, captchaToken]
      properties:
        body:
          type: string
        captchaToken:
          type: string
        posterToken:
          type: string
        displayName:
          type: string
        options:
          type: string
        deletePassword:
          type: string
