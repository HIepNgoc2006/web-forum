  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>36chan</title>
    <meta
      name="description"
      content="36chan: diễn đàn ảnh sinh viên ẩn danh theo thời gian thực, có AI kiểm duyệt và quản trị viên duyệt bài."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/styles.css" />
    <!--
      First-paint route shell: home is active in HTML by default. Before the
      module bootstrap finishes network work, force the hash's screen so reloads
      do not flash the homepage.
    -->
    <script>
      (function () {
        var raw = location.hash || '#home';
        var path = raw.split('?')[0];
        var match = path.match(/^#([^/]+)\/?(.+)?$/);
        var name = match && match[1];
        var id = match && match[2];
        var screen = 'home';
        if (!name || name === 'home') screen = 'home';
        else if (name === 'policy') screen = 'policy';
        else if (name === 'register') screen = 'register';
        else if (name === 'login') screen = 'login';
        else if (name === 'forgot') screen = 'forgot';
        else if (name === 'account') screen = 'account';
        else if (name === 'thread' && id) screen = 'thread';
        else if (name === 'catalog') screen = 'catalog';
        else if (name === 'archive') screen = 'archive';
        else if (name === 'admin') screen = 'admin';
        else screen = 'board';
        document.documentElement.dataset.initialScreen = screen;
      })();
    </script>
    <style id="boot-route-style">
      /* Hide empty app chrome until bootstrap + first route data finish. */
      html:not(.app-ready) .topbar,
      html:not(.app-ready) .layout,
      html:not(.app-ready) #quickReply {
        visibility: hidden !important;
        pointer-events: none !important;
      }
      html:not(.app-ready) #appBootLoader {
        display: flex !important;
      }
      html.app-ready #appBootLoader {
        display: none !important;
      }
      #appBootLoader {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 14px;
        background: linear-gradient(180deg, #fff6e8 0%, #ffe7c8 100%);
        color: #800000;
        font-family: Tahoma, 'Segoe UI', sans-serif;
      }
      #appBootLoader .boot-logo {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      #appBootLoader .boot-clover {
        width: 42px;
        height: 42px;
        position: relative;
      }
      #appBootLoader .boot-clover span {
        position: absolute;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #3d9e3d;
      }
      #appBootLoader .boot-clover span:nth-child(1) { top: 0; left: 11px; }
      #appBootLoader .boot-clover span:nth-child(2) { top: 11px; left: 0; }
      #appBootLoader .boot-clover span:nth-child(3) { top: 11px; right: 0; }
      #appBootLoader .boot-clover span:nth-child(4) { bottom: 0; left: 11px; }
      #appBootLoader .boot-title {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      #appBootLoader .boot-status {
        font-size: 13px;
        opacity: 0.85;
      }
      html[data-initial-screen]:not([data-initial-screen='home']) #homeScreen {
        display: none !important;
      }
      html[data-initial-screen='policy'] #policyScreen,
      html[data-initial-screen='board'] #boardScreen,
      html[data-initial-screen='catalog'] #catalogScreen,
      html[data-initial-screen='archive'] #archiveScreen,
      html[data-initial-screen='thread'] #threadScreen,
      html[data-initial-screen='register'] #registerScreen,
      html[data-initial-screen='login'] #loginScreen,
      html[data-initial-screen='forgot'] #forgotScreen,
      html[data-initial-screen='account'] #accountScreen,
      html[data-initial-screen='admin'] #adminScreen {
        display: block !important;
      }
    </style>
  </head>
