<!doctype html>
<html lang="vi">
  <!-- @include index-partials/head.html -->
  <body>
    <script>
      (function () {
        var screen = document.documentElement.dataset.initialScreen || 'home';
        document.body.classList.toggle('home-page', screen === 'home');
        document.body.classList.toggle('policy-page', screen === 'policy');
        document.body.classList.toggle(
          'account-page',
          screen === 'register' || screen === 'login' || screen === 'forgot' || screen === 'account'
        );
        document.body.classList.toggle(
          'board-page',
          screen === 'board' || screen === 'catalog' || screen === 'archive' || screen === 'thread'
        );
      })();
    </script>
    <div id="appBootLoader" role="status" aria-live="polite" aria-busy="true">
      <div class="boot-logo">
        <div class="boot-clover" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="boot-title">36chan</div>
      </div>
      <div class="boot-status">Đang tải…</div>
    </div>
    <script>
      // If the app module never loads, still reveal the page after a timeout.
      setTimeout(function () {
        if (!document.documentElement.classList.contains('app-ready')) {
          document.documentElement.classList.add('app-ready');
          var loader = document.getElementById('appBootLoader');
          if (loader) loader.setAttribute('hidden', '');
        }
      }, 15000);
    </script>
    <!-- @include index-partials/topbar.html -->

    <main class="layout">
      <!-- @include index-partials/home.html -->

      <!-- @include index-partials/policy.html -->

      <!-- @include index-partials/board.html -->

      <!-- @include index-partials/catalog.html -->

      <!-- @include index-partials/archive.html -->

      <!-- @include index-partials/thread.html -->

      <!-- @include index-partials/account.html -->

      <!-- @include index-partials/admin.html -->
    </main>

    <!-- @include index-partials/quick-reply.html -->
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
